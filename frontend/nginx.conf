server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The JS bundle is ~600 KB uncompressed and compresses to under a third of that.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so a changed file is a changed URL and the old one can
    # be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # index.html itself must never be cached, or a browser would keep loading the old
        # bundle's filenames after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_connect_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
