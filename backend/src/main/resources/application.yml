spring:
  application:
    name: liquidity-manager

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/liquidity}
    username: ${SPRING_DATASOURCE_USERNAME:liquidity}
    password: ${SPRING_DATASOURCE_PASSWORD:liquidity}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

treasury:
  base-url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.project.liquidity: DEBUG
