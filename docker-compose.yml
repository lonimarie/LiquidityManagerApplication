services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liquidity
      POSTGRES_USER: liquidity
      POSTGRES_PASSWORD: liquidity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidity -d liquidity"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidity
      SPRING_DATASOURCE_USERNAME: liquidity
      SPRING_DATASOURCE_PASSWORD: liquidity
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
